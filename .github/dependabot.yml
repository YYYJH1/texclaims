version: 2
updates:
  # The Node 20 deprecation sat in green CI logs as a warning nobody had to
  # read. This is what opens a pull request for the next one.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

# No pip entry: the one runtime dependency is declared as a range (PyYAML>=6.0)
# and the test matrix already installs the newest resolvable set every week.
