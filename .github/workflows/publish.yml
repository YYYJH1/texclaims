name: Publish

# Trusted Publishing: no API token is stored in this repository. PyPI is
# configured to trust this workflow, in this repository, in the `pypi`
# environment, and an OIDC token minted per run stands in for the secret.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build

      - name: the artifact that ships must pass its own suite
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && pip install -e ".[dev]" && pytest -q

      - name: a release must publish the version it is tagged with
        # Uploading 0.1.0 from a tag that says v0.1.1 is unfixable after the
        # fact: PyPI never lets a version be replaced.
        if: github.event_name == 'release'
        run: |
          built=$(ls dist/*.whl | sed -E 's|.*/texclaims-([^-]+)-py3.*|\1|')
          tagged="${GITHUB_REF_NAME#v}"
          test "$built" = "$tagged" || {
            echo "::error::tag $GITHUB_REF_NAME carries version $built"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/texclaims
    permissions:
      id-token: write   # the only job that may mint the OIDC token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.2
