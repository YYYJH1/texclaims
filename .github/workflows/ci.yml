name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # A gate that only runs when someone pushes is not watching anything. Once
    # a week, so a new Python release or a PyYAML change surfaces here rather
    # than in somebody's submission.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  self-audit:
    # texclaims gates its own example the way it would gate a submission.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - working-directory: examples/demo
        run: |
          texclaims check --ledger claims.yaml
          texclaims scan --ledger claims.yaml --strict
          texclaims generate --ledger claims.yaml --check

  package:
    # The sdist promises a runnable suite; nothing checked that until now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: the shipped sdist must carry a suite that runs
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          cd /tmp/sdist && pip install -e ".[dev]" && pytest -q
      - name: the wheel must install and run
        run: |
          pip install --force-reinstall dist/*.whl
          texclaims --version

  next-python:
    # Python 3.15 is out but not claimed: PyYAML 6.0.3, the floor and still the
    # newest release, ships no 3.15 wheel, so pip builds it from source here.
    # This job lets the weekly run see 3.15 without gating on it. Once a 3.15
    # wheel exists, raise the floor to it, record its tags in test_readme.py,
    # and move 3.15 into the matrix above.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install -e ".[dev]"
      - run: pytest -q
