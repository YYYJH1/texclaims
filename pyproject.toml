[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "texclaims"
dynamic = ["version"]
description = "Deterministic audit of the numbers in your LaTeX manuscript against the experiment artifacts that produced them."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jiahao You", email = "50474492+YYYJH1@users.noreply.github.com" }]
keywords = ["latex", "reproducibility", "ci", "science", "provenance", "claims"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["PyYAML>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
texclaims = "texclaims.cli:main"

[project.urls]
Homepage = "https://github.com/YYYJH1/texclaims"
Repository = "https://github.com/YYYJH1/texclaims"
Issues = "https://github.com/YYYJH1/texclaims/issues"
Changelog = "https://github.com/YYYJH1/texclaims/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "texclaims.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
